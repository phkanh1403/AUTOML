stages:
  preprocess_images:
    cmd: python automl-core/preprocessing/auto_eda.py --modality image --input data/raw/images --output data/processed/images
    deps:
      - data/raw/images
      - automl-core/preprocessing/auto_eda.py
    outs:
      - data/processed/images
  preprocess_tabular:
    cmd: python automl-core/preprocessing/auto_eda.py --modality tabular --input data/raw/tabular --output data/processed/tabular
    deps:
      - data/raw/tabular
      - automl-core/preprocessing/auto_eda.py
    outs:
      - data/processed/tabular
